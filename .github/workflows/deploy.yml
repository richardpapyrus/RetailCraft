name: Deploy to Production

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate

      - name: Build app
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://app.retailcraft.com.ng/api"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/retail-craft
          chmod 600 ~/.ssh/retail-craft
          ssh-keyscan -H 165.227.26.131 >> ~/.ssh/known_hosts

      # ecosystem.config.js reads its secrets from the git-ignored .env in the
      # deploy folder. Rebuild it from GitHub secrets on every deploy so the repo
      # secrets are the single source of truth. Values travel over ssh stdin,
      # never on a command line, so they cannot end up in this public log or in
      # the server's process list. It runs before rsync, so a missing secret
      # stops the deploy before any new files reach the server (rsync excludes
      # .env, so it never touches this file).
      - name: Write server .env from secrets
        env:
          DATABASE_URL_PROD: ${{ secrets.DATABASE_URL_PROD }}
          JWT_SECRET_PROD: ${{ secrets.JWT_SECRET_PROD }}
        run: |
          for name in DATABASE_URL_PROD JWT_SECRET_PROD; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::GitHub secret $name is not set"; exit 1
            fi
            case "$value" in *$'\n'*|*$'\r'*)
              echo "::error::GitHub secret $name must be a single line"; exit 1;;
            esac
          done
          printf '%s=%s\n' \
            DATABASE_URL_PROD "$DATABASE_URL_PROD" \
            JWT_SECRET_PROD "$JWT_SECRET_PROD" |
          ssh -i ~/.ssh/retail-craft root@165.227.26.131 \
            'umask 077 && cat > /root/retail-craft-app/.env.new && mv /root/retail-craft-app/.env.new /root/retail-craft-app/.env'

      - name: Transfer files via rsync
        run: |
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'apps/api/.env' \
            --exclude 'node_modules/' \
            --exclude '.next/cache/' \
            --exclude 'apps/api/uploads/' \
            -e "ssh -i ~/.ssh/retail-craft" \
            ./ root@165.227.26.131:/root/retail-craft-app/

      # Migrations are applied via scripts/deploy-migrate.sh, which resolves the
      # connection string from ecosystem.config.js — the same place the running
      # pm2 app gets it. Calling `prisma migrate deploy` directly here would
      # instead read the committed apps/api/.env, which points at the staging
      # database and would silently migrate the wrong server.
      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/retail-craft root@165.227.26.131 "
            cd /root/retail-craft-app/ && \
            npm install --production && \
            (cd apps/api && npx prisma generate) && \
            bash scripts/deploy-migrate.sh pos-api-prod && \
            pm2 startOrReload ecosystem.config.js --only pos-api-prod,pos-web-prod,pos-docs-prod --update-env && \
            pm2 save
          "

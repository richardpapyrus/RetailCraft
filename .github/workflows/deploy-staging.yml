name: Deploy to Staging

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate

      - name: Build app
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://staging.retailcraft.com.ng/api"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/retail-craft
          chmod 600 ~/.ssh/retail-craft
          ssh-keyscan -H 165.227.26.131 >> ~/.ssh/known_hosts

      - name: Transfer files via rsync
        run: |
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'apps/api/.env' \
            --exclude 'node_modules/' \
            --exclude '.next/cache/' \
            --exclude 'apps/api/uploads/' \
            --exclude 'uploads_staging/' \
            -e "ssh -i ~/.ssh/retail-craft" \
            ./ root@165.227.26.131:/root/retail-craft-staging/

      # ecosystem.config.js reads its secrets from the git-ignored .env in the
      # deploy folder. Rebuild it from GitHub secrets on every deploy so the repo
      # secrets are the single source of truth. Values travel over ssh stdin,
      # never on a command line, so they cannot end up in this public log or in
      # the server's process list.
      - name: Write server .env from secrets
        env:
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
          JWT_SECRET_STAGING: ${{ secrets.JWT_SECRET_STAGING }}
        run: |
          for name in DATABASE_URL_STAGING JWT_SECRET_STAGING; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::GitHub secret $name is not set"; exit 1
            fi
            case "$value" in *$'\n'*|*$'\r'*)
              echo "::error::GitHub secret $name must be a single line"; exit 1;;
            esac
          done
          printf '%s=%s\n' \
            DATABASE_URL_STAGING "$DATABASE_URL_STAGING" \
            JWT_SECRET_STAGING "$JWT_SECRET_STAGING" |
          ssh -i ~/.ssh/retail-craft root@165.227.26.131 \
            'umask 077 && cat > /root/retail-craft-staging/.env.new && mv /root/retail-craft-staging/.env.new /root/retail-craft-staging/.env'

      # See deploy.yml — the migration target is resolved from ecosystem.config.js
      # so it can never diverge from the database this pm2 app actually runs on.
      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/retail-craft root@165.227.26.131 "
            cd /root/retail-craft-staging/ && \
            npm install --production && \
            (cd apps/api && npx prisma generate) && \
            bash scripts/deploy-migrate.sh pos-api-staging && \
            pm2 startOrReload ecosystem.config.js --only pos-api-staging,pos-web-staging,pos-docs-staging --update-env && \
            pm2 save
          "
